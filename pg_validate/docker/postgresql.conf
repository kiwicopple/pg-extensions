# Server settings for every version in compose.yaml (pg16, pg17, pg18).
#
# Mirrors the throwaway cluster that test/lib/cluster.sh starts for
# test/run.sh: a plain `initdb` started with `-c fsync=off -c
# full_page_writes=off`. Used as the server's config_file, so it is the whole
# configuration; pg_hba.conf still comes from the data directory.

listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
timezone = 'UTC'
log_timezone = 'UTC'

fsync = off
full_page_writes = off

# pg_tle, for test/spec/03_tle_install.sql's pgtle.install_extension branch.
shared_preload_libraries = 'pg_tle'

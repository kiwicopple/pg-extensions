# Postgres 16, 17 and 18 with pg_tle, for test/run.sh and bench/run.sh.
# See README.md in this directory. Run one service at a time for benchmarks
# (docker/run-matrix.sh does): they share the host's CPUs.
name: pg_permissions

x-pg: &pg
  # The same limits for every version, so they compare fairly. The Docker
  # Desktop VM has 10 CPUs and ~9.7 GB; one server runs at a time.
  # run-matrix.sh reads the limits back from the container's cgroup for the
  # `host` field of the benchmark JSON, so change them only here.
  cpus: 4
  mem_limit: 6g
  # Parallel query uses dynamic shared memory in /dev/shm; Docker's default
  # 64 MB can fail parallel hash joins at large scale.
  shm_size: 1g
  environment:
    POSTGRES_HOST_AUTH_METHOD: trust   # local benchmarking only; ports bind to 127.0.0.1
  command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "postgres", "-h", "/var/run/postgresql"]
    interval: 1s
    timeout: 3s
    retries: 60

services:
  pg16:
    <<: *pg
    image: pg_permissions-pg:16
    build: { context: ., args: { PG_TAG: 16.15-trixie, PG_MAJOR: "16" } }
    ports: ["127.0.0.1:54316:5432"]
    volumes:
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ..:/pg_permissions
      - pg16-data:/var/lib/postgresql/data
      - pg16-run:/var/run/postgresql

  pg17:
    <<: *pg
    image: pg_permissions-pg:17
    build: { context: ., args: { PG_TAG: 17.11-trixie, PG_MAJOR: "17" } }
    ports: ["127.0.0.1:54317:5432"]
    volumes:
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ..:/pg_permissions
      - pg17-data:/var/lib/postgresql/data
      - pg17-run:/var/run/postgresql

  pg18:
    <<: *pg
    image: pg_permissions-pg:18
    build: { context: ., args: { PG_TAG: 18.6-trixie, PG_MAJOR: "18" } }
    ports: ["127.0.0.1:54318:5432"]
    volumes:
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ..:/pg_permissions
      # 18's image keeps PGDATA in /var/lib/postgresql/18/docker and declares
      # the volume one level up.
      - pg18-data:/var/lib/postgresql
      - pg18-run:/var/run/postgresql

# Data lives in named volumes (not tmpfs, which would count against mem_limit
# and vanish on stop). Every test and benchmark run creates and drops its own
# databases, so nothing carries over between runs. `docker compose down -v`
# deletes them. The *-run volumes hold the server's Unix socket, shared with
# the `docker compose run` client containers that run the harness.
volumes:
  pg16-data:
  pg16-run:
  pg17-data:
  pg17-run:
  pg18-data:
  pg18-run:

# Server settings for every version in compose.yaml (pg16, pg17, pg18).
#
# Mirrors the throwaway cluster that test/lib/cluster.sh starts for
# test/run.sh and bench/run.sh, so Docker numbers line up with local ones:
# that cluster is a plain `initdb` (upstream defaults: shared_buffers 128MB,
# max_connections 100, everything else default) started with
# `-c fsync=off -c full_page_writes=off`. Nothing else is tuned on purpose.
#
# Used as the server's config_file (`postgres -c config_file=...`), so it is
# the whole configuration; pg_hba.conf still comes from the data directory.

# The image's initdb sets these too; the local cluster listens on a Unix
# socket only, the containers also on TCP for clients on the host.
listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
timezone = 'UTC'
log_timezone = 'UTC'

# Same as the throwaway cluster: durability off, write numbers are optimistic.
fsync = off
full_page_writes = off

# pg_tle, for test/spec/03_tle_install.sql's pgtle.install_extension branch.
shared_preload_libraries = 'pg_tle'
